<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" role="img" aria-labelledby="title desc">
<title id="title">BloodScope on-device AI pipeline</title><desc id="desc">Smartphone microscope images flow through a YOLO26n model, then CoreML and Flutter on iPhone, to classify 13 white blood cell types.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d5e2ef" stroke-width="1"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#52799f"/></marker></defs>
<path fill="#e9f1f9" d="M0 0h640v500H0z"/><path fill="url(#grid)" d="M0 0h640v500H0z"/>
<g font-family="Arial, sans-serif"><text x="36" y="36" font-size="11" letter-spacing="2" fill="#56718c">FROM IMAGE TO INSIGHT</text><text x="604" y="36" text-anchor="end" font-size="11" fill="#56718c">ON-DEVICE AI</text>
<path d="M320 134v38M320 272v37" stroke="#52799f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="116" y="66" width="408" height="68" rx="3" fill="white" stroke="#b3c7da"/><text x="140" y="106" font-size="13" fill="#5c7d9e">01</text><text x="190" y="95" font-size="17" fill="#183b5d">Microscope images</text><text x="190" y="116" font-size="12" fill="#5c7187">Captured with a smartphone</text>
<rect x="86" y="183" width="468" height="89" rx="3" fill="#173b60"/><text x="112" y="223" font-size="13" fill="#a5c8ef">02</text><text x="166" y="220" font-size="25" fill="white">YOLO26n</text><text x="166" y="245" font-size="13" fill="#c0d5eb">White blood cell classification</text><rect x="431" y="201" width="101" height="52" rx="2" fill="#2b547b"/><text x="481" y="224" text-anchor="middle" font-size="18" fill="white">13</text><text x="481" y="242" text-anchor="middle" font-size="11" fill="#c0d5eb">CELL TYPES</text>
<rect x="116" y="320" width="408" height="68" rx="3" fill="white" stroke="#b3c7da"/><text x="140" y="360" font-size="13" fill="#5c7d9e">03</text><text x="190" y="350" font-size="17" fill="#183b5d">CoreML + Flutter</text><text x="190" y="372" font-size="12" fill="#5c7187">Inference on iPhone</text>
