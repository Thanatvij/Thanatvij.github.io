method:
  eyebrow: How the flagship was built
  titleStart: From raw images to
  titleEmphasis: a model on the phone.
  lead: ตัวอย่างขั้นตอนการทำงานจากโครงการ BloodScope ตั้งแต่ข้อมูลดิบจนถึงแอปบนอุปกรณ์จริง
  steps:
    - title: Data
      text: รวบรวมภาพจาก 4 แหล่ง แล้ว re-annotate ให้ตรงกันเป็น 13 คลาส
      label: 17,767 images
    - title: Model
      text: ฝึกโมเดล YOLO26n ด้วย degradation augmentation, repeat-factor sampling และ Equalized Quality Focal Loss
      label: YOLO26n
    - title: Evaluate
      text: ทดสอบบนชุดทดสอบ 13 คลาส และบนภาพจริงจากโรงพยาบาล
      label: 86.04% mAP50 · 80.87% on real images
    - title: Deploy
      text: นำโมเดล CoreML ไปใช้ในแอป Flutter บน iPhone ประมวลผลบนอุปกรณ์ ไม่ส่งภาพขึ้น Cloud
      label: CoreML · Flutter · on-device
  foot:
    text: "PakD ใช้แนวทางเดียวกันกับโจทย์อื่น: เปรียบเทียบ 3 โมเดล (EfficientNetV2-S, MobileNetV3, YOLOv12n) แล้วเลือก EfficientNetV2-S ที่ Macro F1 0.7629"
    linkLabel: อ่านต่อใน PakD case study
    linkHref: /projects/pakd/

